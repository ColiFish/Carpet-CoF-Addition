# ---------- Gradle ----------
# preferIPv4Stack：这台机器访问 maven.fabricmc.net 时通时不通，强制走 IPv4 更稳。
org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true

# maven.fabricmc.net 在国内是“能通但极慢且会停顿”（实测 12 秒只传几十到几百 KB）。
# 与其把“停顿”拖成“等死”，不如让失败来得快些，然后靠 build-retry.ps1 反复重试：
# Gradle 会把每次成功下载的构件缓存下来，重跑就能接着往下推进。
systemProp.org.gradle.internal.http.connectionTimeout=20000
systemProp.org.gradle.internal.http.socketTimeout=30000

# ---------- Fabric / Minecraft ----------
minecraft_version=1.21.4
# 与 Carpet 1.4.161 用的 loader 版本保持一致
loader_version=0.16.9

# ---------- Mod 自身信息 ----------
mod_version=1.0.1
maven_group=carpet.cof
archives_base_name=Carpet-CoF-Addition

# ---------- Carpet（放在 libs/ 下的本地依赖，见 README） ----------
carpet_version=1.4.161
carpet_jar=fabric-carpet-1.21.4-1.4.161+v241203.jar
