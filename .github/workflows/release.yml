name: release

# 推送 v* 标签时自动构建并把 jar 附到 GitHub Release。
# Release 说明默认由 GitHub 依据提交自动生成，发布后可在网页上改写成 CHANGELOG 的分节内容。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布或更新的 tag（例如 v1.0.0）
        required: true
        type: string

permissions:
  contents: write   # 创建 Release 需要写权限

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 准备 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 下载 Carpet 本体
        run: |
          set -euo pipefail
          MC=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          JAR=$(sed -n 's/^carpet_jar=//p' gradle.properties)
          echo "minecraft=$MC  carpet_jar=$JAR"
          mkdir -p libs
          URL=$(curl -sS -H 'User-Agent: Carpet-CoF-Addition-ci' \
            "https://api.modrinth.com/v2/project/carpet/version?game_versions=%5B%22${MC}%22%5D&loaders=%5B%22fabric%22%5D" \
            | jq -r --arg f "$JAR" '.[] | .files[] | select(.filename == $f) | .url' | head -n1)
          if [ -z "$URL" ]; then
            echo "::error::Modrinth 上没有找到 $JAR（检查 gradle.properties 的 carpet_jar）"
            exit 1
          fi
          curl -sSL -o "libs/$JAR" "$URL"
          ls -l libs

      - name: 构建
        run: |
          chmod +x ./gradlew   # 仓库在 Windows 上提交，可能没带可执行位
          ./gradlew build --no-daemon --stacktrace

      - name: 整理产物（文件名里的空格换成连字符，下载链接更好看）
        run: |
          set -euo pipefail
          NAME=$(sed -n 's/^archives_base_name=//p' gradle.properties)
          VER=$(sed -n 's/^mod_version=//p' gradle.properties)
          mkdir -p out
          cp "build/libs/${NAME}-${VER}.jar"           "out/Carpet-CoF-Addition-${VER}.jar"
          cp "build/libs/${NAME}-${VER}-sources.jar"   "out/Carpet-CoF-Addition-${VER}-sources.jar"
          ls -l out

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "目标 tag：$TAG"
          # 若该 tag 的 Release 已存在（例如手工发过），只覆盖上传附件，保留原有说明；
          # 否则新建一个。这样无论谁先动手，工作流都不会因 already_exists 失败。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传附件"
            gh release upload "$TAG" out/*.jar --clobber
          else
            echo "Release $TAG 不存在，新建"
            gh release create "$TAG" out/*.jar \
              --title "${TAG#v}" \
              --generate-notes \
              --verify-tag
          fi
